name: routes

services:
  app:
    build: ./app
    ports:
      - "7201:3000"
    environment:
      - OTP_URL=http://otp:8080/otp/gtfs/v1
    restart: unless-stopped
    mem_limit: 1g

  otp:
    image: docker.io/opentripplanner/opentripplanner:latest
    volumes:
      - ./otp-data:/var/opentripplanner
    ports:
      - "8080:8080"
    command: ["--load", "--serve"]
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx6g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    mem_limit: 8g
